<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>更新随练</title><style>body{margin:0;background:#f5f4ed;color:#203d35;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.9}main{max-width:450px;margin:15vh auto;padding:28px}h1{font-size:30px}p{font-size:15px;color:#657769}button,a{display:inline-block;background:#f66a3d;color:#203d35;border:0;border-radius:12px;padding:14px 20px;font-size:15px;text-decoration:none;margin:12px 8px 0 0}small{display:block;color:#758376;font-size:12px;margin-top:24px}</style></head><body><main><h1>正在更新随练</h1><p id="status" role="status">正在检查最新工具，训练草稿会保留。</p><button id="retry" hidden>重新检查</button><a href="./" id="returnLink" hidden>返回随练</a><small>只更新随练自己的工具缓存，不删除草稿、网站数据或登录信息。</small></main><script>
(function () {
  'use strict';
  const status = document.getElementById('status');
  const reached = (worker, desired) => desired === 'installed' ? ['installed', 'activating', 'activated'].includes(worker.state) : worker.state === desired;
  function waitFor(worker, desired) {
    if (reached(worker, desired)) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const timeout = setTimeout(() => { worker.removeEventListener('statechange', check); reject(new Error('更新暂未完成，请保持联网后重试。')); }, 20000);
      function check() {
        if (reached(worker, desired)) { clearTimeout(timeout); worker.removeEventListener('statechange', check); resolve(); }
        else if (worker.state === 'redundant') { clearTimeout(timeout); worker.removeEventListener('statechange', check); reject(new Error('新版尚未准备好，请稍后重新检查。')); }
      }
      worker.addEventListener('statechange', check); check();
    });
  }
  async function update() {
    document.getElementById('retry').hidden = true; document.getElementById('returnLink').hidden = true;
    try {
      if (!['http:', 'https:'].includes(location.protocol) || !navigator.serviceWorker) throw new Error('请从联网的随练网址打开更新入口。');
      const base = new URL('./', location.href);
      const registration = await navigator.serviceWorker.register(new URL('sw.js', base), {scope: base.pathname, updateViaCache: 'none'});
      await registration.update();
      const installing = registration.installing;
      if (installing) { status.textContent = '新版正在准备，已有草稿不会清空…'; await waitFor(installing, 'installed'); }
      const waiting = registration.waiting || (installing?.state === 'installed' ? installing : null);
      if (waiting) { status.textContent = '新版已就绪，正在切换工具…'; waiting.postMessage({type: 'ACTIVATE_UPDATE'}); await waitFor(waiting, 'activated'); }
      else if (registration.active) await waitFor(registration.active, 'activated');
      else throw new Error('离线工具尚未准备好，请保持联网后重试。');
      status.textContent = '更新完成，正在打开随练…';
      location.replace(new URL('./?updated=' + Date.now(), base).href);
    } catch (error) {
      status.textContent = error.message + ' 草稿仍保留在本机。';
      document.getElementById('retry').hidden = false; document.getElementById('returnLink').hidden = false;
    }
  }
  document.getElementById('retry').onclick = update;
  update();
})();
</script></body></html>
